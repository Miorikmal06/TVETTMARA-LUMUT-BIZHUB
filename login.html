<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Log masuk — BizHub</title>
<link rel="icon" href="assets/logo.webp"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..900,100&family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F3F8EA;--g:#4A8A0E;--gd:#1F3B0B;--mut:#5C6B4E;--line:#D9E4C8;--red:#B03A2E}
body{font-family:'Bricolage Grotesque',sans-serif;background:var(--bg);color:#16210E;min-height:100svh;display:grid;grid-template-columns:1.1fr 1fr}
:focus-visible{outline:3px solid #E8761E;outline-offset:2px}
.l{background:var(--gd);color:#F3F8EA;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.l canvas{position:absolute;inset:0;width:100%;height:100%}
.l a,.l p{position:relative}
.l a{color:#F3F8EA;text-decoration:none;font-weight:700}
.big{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(64px,11vw,150px);line-height:.9;color:#7DB52E;font-variation-settings:'SOFT' 100;position:relative}
.l p{opacity:.65;max-width:320px;font-size:14px}
.r{display:grid;place-items:center;padding:32px}
form{width:100%;max-width:360px}
h1{font-family:'Fraunces',serif;font-size:36px;font-weight:800;line-height:1.05;margin-bottom:8px;font-variation-settings:'SOFT' 100}
.s{color:var(--mut);font-size:14px;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:500;margin:0 0 6px}
.f{margin-bottom:16px;position:relative}
input{font:inherit;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(74,138,14,.12)}
.eye{position:absolute;right:8px;bottom:6px;border:0;background:none;font:inherit;font-size:12px;color:var(--mut);cursor:pointer;padding:8px}
button.go{width:100%;font:inherit;font-weight:700;padding:15px;border:0;border-radius:12px;background:var(--gd);color:#fff;cursor:pointer;margin-top:6px;transition:background .2s}
button.go:hover{background:var(--g)}button.go:disabled{opacity:.55}
.err{display:none;background:#FDF2F0;color:var(--red);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.err.on{display:block}
.back{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--mut);text-decoration:none}
@media(max-width:800px){body{grid-template-columns:1fr}.l{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="l">
  <a href="index.html">← BizHub</a>
  <div><div class="big">Biz<br>Hub</div></div>
  <p>Panel untuk pentadbir program. Tambah, kemas kini dan padam gerai pelajar.</p>
</div>
<div class="r">
  <form id="f">
    <h1>Log masuk admin</h1>
    <p class="s">Gunakan e-mel dan kata laluan akaun admin anda.</p>
    <div class="err" id="err" role="alert"></div>
    <div class="f"><label for="e">E-mel</label><input id="e" type="email" autocomplete="username" required/></div>
    <div class="f"><label for="p">Kata laluan</label><input id="p" type="password" autocomplete="current-password" required style="padding-right:64px"/><button type="button" class="eye" id="eye">Tunjuk</button></div>
    <button class="go" id="go">Log masuk</button>
    <a class="back" href="index.html">Kembali ke laman utama</a>
  </form>
</div>
<script type="module">
import {auth} from "./assets/firebase.js";
import {signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const $=id=>document.getElementById(id);
onAuthStateChanged(auth,u=>{if(u)location.replace('admin.html')});
$('eye').onclick=()=>{const t=$('p').type==='password';$('p').type=t?'text':'password';$('eye').textContent=t?'Sembunyi':'Tunjuk'};
$('f').onsubmit=async ev=>{
  ev.preventDefault();$('err').classList.remove('on');$('go').disabled=true;$('go').textContent='Mengesahkan...';
  try{await signInWithEmailAndPassword(auth,$('e').value.trim(),$('p').value);location.replace('admin.html')}
  catch(e){
    const m={'auth/too-many-requests':'Terlalu banyak percubaan. Tunggu beberapa minit, kemudian cuba lagi.','auth/network-request-failed':'Tiada sambungan internet. Semak rangkaian anda.'}[e.code]||'E-mel atau kata laluan tidak betul. Semak dan cuba lagi.';
    $('err').textContent=m;$('err').classList.add('on');$('go').disabled=false;$('go').textContent='Log masuk';
  }
};
</script>
</body>
</html>
