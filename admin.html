<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Panel admin — BizHub</title>
<link rel="icon" href="assets/logo.webp"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..900,100&family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F3F8EA;--g:#4A8A0E;--gd:#1F3B0B;--mut:#5C6B4E;--line:#D9E4C8;--red:#B03A2E}
body{font-family:'Bricolage Grotesque',sans-serif;background:var(--bg);color:#16210E;line-height:1.5}
:focus-visible{outline:3px solid #E8761E;outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,40px);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header b{font-family:'Fraunces',serif;font-weight:900;font-size:22px;color:var(--g)}
header div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.b{font:inherit;font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:inherit}
.b:hover{border-color:var(--g)}
.b.p{background:var(--gd);border-color:var(--gd);color:#fff}.b.p:hover{background:var(--g)}
.b.d{color:var(--red)}.b.d:hover{background:#FDF2F0;border-color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:32px clamp(16px,4vw,40px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:24px}
h1{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1;font-variation-settings:'SOFT' 100}
.top p{color:var(--mut);font-size:14px;margin-top:6px}
.st{display:flex;gap:10px}
.st div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 18px;text-align:center}
.st strong{display:block;font-family:'Fraunces',serif;font-size:24px;line-height:1.1}.st small{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:10px;margin-bottom:14px}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(74,138,14,.12)}
.tw{background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:12px 16px;border-bottom:1px solid var(--line);background:#FAFCF5}
td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--line);display:block}
td .n{font-family:'Fraunces',serif;font-weight:700;font-size:17px}
.bg{font-size:12px;font-weight:700;color:var(--g);background:#E8F0D8;padding:4px 10px;border-radius:99px;white-space:nowrap}
.ac{display:flex;gap:6px}
.em{text-align:center;padding:48px 16px;color:var(--mut)}
.ov{position:fixed;inset:0;z-index:100;background:rgba(15,25,8,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px}
.ov.open{display:flex}
.md{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:92svh;overflow:auto}
.mh{padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.mh h2{font-family:'Fraunces',serif;font-size:24px;font-weight:800}
.mb{padding:20px 24px 24px;display:grid;gap:16px}
label.l{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.g2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row .x{flex:none;width:40px;height:40px;padding:0}
.prod{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.up{display:flex;align-items:center;gap:10px}
.up img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.up img[src=""],.up img:not([src]){display:none}
.up input[type=file]{padding:8px;font-size:13px}
.fa{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;padding-top:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--gd);color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:all .3s;max-width:90vw}
.toast.on{transform:translate(-50%,0);opacity:1}.toast.er{background:var(--red)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <b>BizHub</b>
  <div><span id="who"></span><a class="b" href="index.html">Lihat laman</a><button class="b" id="out">Log keluar</button></div>
</header>
<main>
  <div class="top">
    <div><h1>Panel pentadbiran</h1><p>Perubahan muncul serta-merta di laman awam.</p></div>
    <div class="st"><div><strong id="sT">0</strong><small>Gerai</small></div><div><strong id="sM">0</strong><small>Ahli</small></div><button class="b p" id="add" style="align-self:stretch">+ Tambah gerai</button></div>
  </div>
  <div class="bar"><input id="q" type="search" placeholder="Cari nama, kategori atau nombor telefon" aria-label="Cari"/></div>
  <div class="tw"><table><thead><tr><th></th><th>Nama gerai</th><th>Kategori</th><th>Telefon</th><th>Ahli</th><th>Tindakan</th></tr></thead><tbody id="tb"><tr><td colspan="6" class="em">Memuatkan...</td></tr></tbody></table></div>
</main>

<div class="ov" id="fo"><div class="md" role="dialog" aria-modal="true" aria-labelledby="ft">
  <div class="mh"><h2 id="ft">Tambah gerai</h2></div>
  <div class="mb">
    <div><label class="l" for="n">Nama gerai *</label><input id="n"/></div>
    <div class="g2">
      <div><label class="l" for="c">Kategori *</label><select id="c"><option value="">Pilih kategori</option><option>Noodle Dish</option><option>Dessert</option><option>Burger</option><option>Minuman</option><option>Barber</option><option>Lain-lain</option></select></div>
      <div><label class="l" for="t">No. telefon *</label><input id="t" type="tel" placeholder="012-345 6789"/></div>
    </div>
    <div><label class="l" for="d">Penerangan</label><textarea id="d" rows="3"></textarea></div>
    <div><label class="l">Gambar makanan utama</label><div class="up"><img id="mi" alt=""/><input type="file" id="mf" accept="image/*"/></div></div>
    <div><label class="l">Produk / menu</label><div id="pl"></div><button type="button" class="b" id="ap">+ Tambah produk</button></div>
    <div><label class="l">Ahli kumpulan</label><div id="ml"></div><button type="button" class="b" id="am">+ Tambah ahli</button></div>
    <div class="fa"><button class="b" id="cx">Batal</button><button class="b p" id="sv">Simpan gerai</button></div>
  </div>
</div></div>

<div class="ov" id="do"><div class="md" style="max-width:380px;padding:28px;text-align:center" role="alertdialog">
  <h2 style="font-family:Fraunces,serif;font-size:24px;margin-bottom:8px">Padam gerai?</h2>
  <p style="color:var(--mut);font-size:14px;margin-bottom:22px">Gerai <b id="dn"></b> akan dipadam dan tidak boleh dipulihkan.</p>
  <div style="display:flex;gap:8px"><button class="b" id="dc" style="flex:1">Batal</button><button class="b p" id="dy" style="flex:1;background:var(--red);border-color:var(--red)">Padam gerai</button></div>
</div></div>
<div class="toast" id="ts"></div>

<script type="module">
import {db,auth,CLOUD_NAME,UPLOAD_PRESET} from "./assets/firebase.js";
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SHOPS=[],editId=null,mainImg='',delId=null,started=false;

onAuthStateChanged(auth,u=>{
  if(!u){location.replace('login.html');return}
  $('who').textContent=u.email;
  if(started)return;started=true;
  onSnapshot(query(collection(db,'shops'),orderBy('createdAt','asc')),s=>{
    SHOPS=s.docs.map(d=>({id:d.id,...d.data()}));
    $('sT').textContent=SHOPS.length;$('sM').textContent=SHOPS.reduce((a,x)=>a+(x.members?.length||0),0);render();
  },e=>{console.error(e);toast('Gagal membaca data. Semak peraturan Firestore dan sambungan.',1)});
});
$('out').onclick=()=>signOut(auth);

function toast(m,er){const t=$('ts');t.textContent=m;t.className='toast on'+(er?' er':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='toast',3400)}

function render(){
  const k=$('q').value.toLowerCase().trim();
  const l=k?SHOPS.filter(s=>[s.name,s.cat,s.tel].some(v=>String(v||'').toLowerCase().includes(k))):SHOPS;
  $('tb').innerHTML=l.length?l.map(s=>`<tr><td>${s.img?`<img src="${esc(s.img)}" alt="">`:''}</td><td><span class="n">${esc(s.name)}</span></td><td><span class="bg">${esc(s.cat)}</span></td><td>${esc(s.tel)}</td><td>${s.members?.length||0}</td>
  <td><div class="ac"><button class="b" data-e="${esc(s.id)}">Edit</button><button class="b d" data-d="${esc(s.id)}">Padam</button></div></td></tr>`).join(''):
  `<tr><td colspan="6" class="em">${k?'Tiada gerai sepadan dengan carian.':'Belum ada gerai. Tekan “Tambah gerai” untuk mula.'}</td></tr>`;
}
$('q').oninput=render;
$('tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)openForm(b.dataset.e);if(b.dataset.d)openDel(b.dataset.d)};

/* image: Cloudinary if configured, else compressed data URL */
function compress(file,max=900,q=.75){return new Promise((res,rej)=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/webp',q))};
  im.onerror=rej;im.src=u})}
async function upload(file){
  if(CLOUD_NAME&&UPLOAD_PRESET){
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',UPLOAD_PRESET);
    const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:'POST',body:fd});
    if(!r.ok)throw new Error('Muat naik Cloudinary gagal');return (await r.json()).secure_url;
  }
  return compress(file);
}
function bindUp(wrap){const f=wrap.querySelector('input[type=file]'),im=wrap.querySelector('img');
  f.onchange=async()=>{if(!f.files[0])return;try{const u=await upload(f.files[0]);f.dataset.url=u;im.src=u}catch(e){toast('Gambar gagal dimuat naik: '+e.message,1)}}}
bindUp($('mf').parentElement);
$('mf').addEventListener('change',()=>{mainImg=$('mf').dataset.url||mainImg});

function prodRow(p={}){const d=document.createElement('div');d.className='prod';
  d.innerHTML=`<div class="row" style="margin:0"><input placeholder="Nama produk" value="${esc(p.name)}"/><button type="button" class="b d x" aria-label="Buang produk">×</button></div><div class="up"><img src="${esc(p.img)}" alt=""/><input type="file" accept="image/*" data-url="${esc(p.img)}"/></div>`;
  d.querySelector('.x').onclick=()=>d.remove();bindUp(d.querySelector('.up'));$('pl').appendChild(d)}
function memRow(m={}){const d=document.createElement('div');d.className='row';
  d.innerHTML=`<input placeholder="Nama ahli" value="${esc(m.n)}"/><input placeholder="Peranan" value="${esc(m.r)}" style="max-width:150px"/><button type="button" class="b d x" aria-label="Buang ahli">×</button>`;
  d.querySelector('.x').onclick=()=>d.remove();$('ml').appendChild(d)}
$('ap').onclick=()=>prodRow();$('am').onclick=()=>memRow();

function openForm(id){
  editId=id||null;const s=id?SHOPS.find(x=>x.id===id):{};
  $('ft').textContent=id?'Kemas kini gerai':'Tambah gerai';
  $('n').value=s.name||'';$('c').value=s.cat||'';$('t').value=s.tel||'';$('d').value=s.desc||'';
  mainImg=s.img||'';$('mi').src=mainImg;$('mf').value='';$('mf').dataset.url=mainImg;
  $('pl').innerHTML='';$('ml').innerHTML='';
  (s.products?.length?s.products:[{}]).forEach(prodRow);(s.members?.length?s.members:[{}]).forEach(memRow);
  $('fo').classList.add('open');document.body.style.overflow='hidden';$('n').focus();
}
const closeForm=()=>{$('fo').classList.remove('open');document.body.style.overflow=''};
$('add').onclick=()=>openForm();$('cx').onclick=closeForm;
addEventListener('keydown',e=>{if(e.key==='Escape'){closeForm();closeDel()}});

$('sv').onclick=async()=>{
  const name=$('n').value.trim(),cat=$('c').value,tel=$('t').value.trim();
  if(!name||!cat||!tel){toast('Isi nama gerai, kategori dan nombor telefon.',1);return}
  const products=[...$('pl').children].map(r=>({name:r.querySelector('input[type=text],input:not([type])').value.trim(),img:r.querySelector('input[type=file]').dataset.url||''})).filter(p=>p.name);
  const members=[...$('ml').children].map(r=>{const i=r.querySelectorAll('input');return{n:i[0].value.trim(),r:i[1].value.trim()||'Ahli'}}).filter(m=>m.n);
  const data={name,cat,tel,href:'tel:+6'+tel.replace(/\D/g,''),img:$('mf').dataset.url||'',desc:$('d').value.trim(),products,members};
  $('sv').disabled=true;$('sv').textContent='Menyimpan...';
  try{
    if(editId){await updateDoc(doc(db,'shops',editId),{...data,updatedAt:serverTimestamp()});toast('Gerai dikemas kini.')}
    else{await addDoc(collection(db,'shops'),{...data,createdAt:serverTimestamp()});toast('Gerai ditambah.')}
    closeForm();
  }catch(e){console.error(e);toast(e.code==='permission-denied'?'Tiada kebenaran. Semak peraturan Firestore.':e.message.includes('exceeds')?'Data terlalu besar. Kurangkan gambar atau guna Cloudinary.':'Gagal menyimpan: '+e.message,1)}
  finally{$('sv').disabled=false;$('sv').textContent='Simpan gerai'}
};

function openDel(id){delId=id;$('dn').textContent=SHOPS.find(x=>x.id===id)?.name||'';$('do').classList.add('open')}
function closeDel(){$('do').classList.remove('open');delId=null}
$('dc').onclick=closeDel;
$('dy').onclick=async()=>{if(!delId)return;const n=$('dn').textContent;try{await deleteDoc(doc(db,'shops',delId));toast(`Gerai ${n} dipadam.`)}catch(e){toast('Gagal memadam: '+e.message,1)}closeDel()};
</script>
</body>
</html>
